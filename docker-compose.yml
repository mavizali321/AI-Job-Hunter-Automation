services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jobhunter
      POSTGRES_USER: jobhunter
      POSTGRES_PASSWORD: jobhunter
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobhunter"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://jobhunter:jobhunter@db:5432/jobhunter
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./profile:/app/profile:ro
      - ./tracker:/app/tracker:ro
      - ./applications:/app/applications

  worker:
    build: .
    command: celery -A app.tasks worker --loglevel=info
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://jobhunter:jobhunter@db:5432/jobhunter
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./profile:/app/profile:ro
      - ./applications:/app/applications

  beat:
    build: .
    command: celery -A app.tasks beat --loglevel=info
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://jobhunter:jobhunter@db:5432/jobhunter
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
