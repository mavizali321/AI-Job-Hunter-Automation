<!DOCTYPE html>
<html>
<head><title>Apply — AI Solutions Engineer at AshbyCo</title></head>
<body>
<h1>AI Solutions Engineer</h1>
<form id="application_form" method="post" action="/submit">
  <label for="name">Full Name</label>
  <input type="text" name="name" id="name" required>

  <label for="email">Email</label>
  <input type="email" name="email" id="email" required>

  <label for="phone">Phone</label>
  <input type="tel" name="phone" id="phone">

  <label for="linkedin">LinkedIn Profile</label>
  <input type="url" name="linkedin" id="linkedin">

  <label for="resume">Resume</label>
  <input type="file" name="resume" id="resume" accept=".pdf,.doc,.docx">

  <button type="submit" data-testid="submit-application">Submit Application</button>
</form>
<div id="confirmation" style="display:none;">
  <h2>Successfully submitted!</h2>
  <p>Your application has been submitted. We will review it shortly.</p>
</div>
<script>
document.getElementById('application_form').addEventListener('submit', function(e) {
  e.preventDefault();
  this.style.display = 'none';
  document.getElementById('confirmation').style.display = 'block';
});
</script>
</body>
</html>
