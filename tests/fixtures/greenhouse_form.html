<!DOCTYPE html>
<html>
<head><title>Apply — AI Engineer at TestCo (Greenhouse)</title></head>
<body>
<h1>Apply for AI Engineer</h1>
<form id="application_form" method="post" action="/submit">
  <label for="first_name">First Name</label>
  <input type="text" id="first_name" name="first_name" required>

  <label for="last_name">Last Name</label>
  <input type="text" id="last_name" name="last_name" required>

  <label for="email">Email</label>
  <input type="email" id="email" name="email" required>

  <label for="phone">Phone</label>
  <input type="tel" id="phone" name="phone">

  <label for="linkedin">LinkedIn</label>
  <input type="url" id="linkedin" name="linkedin">

  <label for="resume">Resume</label>
  <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx">

  <button type="submit">Submit Application</button>
</form>
<div id="confirmation" style="display:none;">
  <h2>Thank you for your application!</h2>
  <p>Your application has been submitted successfully.</p>
</div>
<script>
document.getElementById('application_form').addEventListener('submit', function(e) {
  e.preventDefault();
  this.style.display = 'none';
  document.getElementById('confirmation').style.display = 'block';
});
</script>
</body>
</html>
